[pytest]
markers =
    validate_csv: tests that validate CSV data
    critical: tests that are critical for data integrity
    unmarked: tests automatically marked by hook

python_files = test_*.py

# addopts = --html=report.html --self-contained-html
addopts = --reportportal --html=report.html --self-contained-html

rp_endpoint = https://reportportal.epam.com
rp_project = olena_sakhanda_personal
rp_launch = csv_validation
rp_launch_attributes = 'Pytest' 'CSV' 'Homework'
rp_launch_description = 'Homework DQE Automation RP'
rp_ignore_attributes = 'xfail' 'usefixture'
